name: CI

# On every push / pull request to main:
#   1. pytest   - Spark pipeline parity with the pandas pipeline, metric edge cases,
#                 reconciliation, and streaming-vs-batch totals (on generated sample data)
#   2. PySpark  - run the full job on sample data and check reconciliation
#   3. Scala    - run the Scala version of the job in spark-shell
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  spark-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-spark.txt
      - name: Unit + parity tests (pytest)
        run: pytest -q
      - name: Generate sample data
        run: python spark/make_sample_data.py --out spark/sample_data
      - name: Run PySpark job (fails if reconciliation fails)
        run: python spark/vendor_summary_spark.py --input-dir spark/sample_data --output-dir spark/output
      - name: Run Scala job in spark-shell
        run: bash spark/scala/run_scala.sh spark/sample_data spark/output_scala
      - name: Upload run metrics
        uses: actions/upload-artifact@v4
        with:
          name: run-metrics
          path: spark/output/run_metrics.json
